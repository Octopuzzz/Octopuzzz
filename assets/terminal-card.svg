      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="artclip">
      <rect x="36" y="86" width="288" height="291"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "JetBrains Mono", "SFMono-Regular", "SF Mono", Menlo,
                   Consolas, "Liberation Mono", "Courier New", monospace;
      dominant-baseline: middle;
    }
    .chrome  { font-size: 11px; fill: #64748b; letter-spacing: 0.4px; }
    .panel   { font-size: 9px;  fill: #22d3ee; letter-spacing: 2.2px; opacity: 0.75; }
    .handle  { font-size: 17px; fill: #22d3ee; font-weight: 700; letter-spacing: 1px; }
    .art     { font-size: 8.4px; fill: #38bdf8; white-space: pre; }
    .key     { font-size: 10px; fill: #7dd3fc; }
    .dots    { font-size: 10px; fill: #1e3a5f; }
    .val     { font-size: 10px; fill: #e2e8f0; }
    .mark    { font-size: 10px; fill: #fbbf24; font-weight: 700; }
    .grp     { font-size: 10px; fill: #fbbf24; letter-spacing: 1.4px; }
    .note    { font-size: 10px; fill: #94a3b8; }

    #frame  { animation: pulse 5s ease-in-out infinite; }
    #beam   { animation: sweep 4s linear infinite; }
    #cursor { animation: blink 1s steps(1, end) infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }
    @keyframes sweep {
      0%   { transform: translateY(0px); }
      100% { transform: translateY(273px); }
    }
    @keyframes blink {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      #frame, #beam, #cursor { animation: none; }
      #beam { opacity: 0; }
    }
  </style>

