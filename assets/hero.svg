<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400"
     role="img" aria-label="Reagent Sandra — backend and streaming data engineer, Jakarta, Indonesia">
  <title>Reagent Sandra — backend &amp; streaming data</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1A1147"/>
      <stop offset="55%"  stop-color="#130D33"/>
      <stop offset="100%" stop-color="#0C0822"/>
    </linearGradient>

    <radialGradient id="auroraA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF4D8D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#38E8C8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38E8C8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7C5CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FF4D8D"/>
      <stop offset="38%"  stop-color="#7C5CFF"/>
      <stop offset="72%"  stop-color="#38E8C8"/>
      <stop offset="100%" stop-color="#FFA23E"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="haze" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>

    <filter id="spark" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card">
      <rect width="900" height="400" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
                   "Helvetica Neue", Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas,
                   "Liberation Mono", monospace;
    }
    .eyebrow { font-size: 11px; letter-spacing: 2.6px; fill: #38E8C8; }
    .name    { font-size: 46px; font-weight: 800; fill: #F7F5FF; letter-spacing: -0.6px; }
    .role    { font-size: 16.5px; fill: #B5ADE0; }
    .chip    { font-size: 12px; fill: #DAD5F7; }
    .stage   { font-size: 11.5px; fill: #CFC9F0; letter-spacing: 0.4px; }
    .quiet   { font-size: 10px; letter-spacing: 2.4px; fill: #8A80C2; }

    /* One bold gesture: packets moving through the pipeline, left to right. */
    .packet { animation: flow 3.6s linear infinite; }
    .p2 { animation-delay: 0.9s; }
    .p3 { animation-delay: 1.8s; }
    .p4 { animation-delay: 2.7s; }

    .node { animation: breathe 3.6s ease-in-out infinite; transform-origin: center; }
    .n2 { animation-delay: 0.9s; }
    .n3 { animation-delay: 1.8s; }
    .n4 { animation-delay: 2.7s; }

    @keyframes flow {
      0%   { transform: translateX(0px);   opacity: 0; }
      6%   { opacity: 1; }
      94%  { opacity: 1; }
      100% { transform: translateX(720px); opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.30; }
      12%      { opacity: 0.85; }
      40%      { opacity: 0.30; }
    }

    @media (prefers-reduced-motion: reduce) {
      .packet { animation: none; opacity: 0.9; }
      .node   { animation: none; opacity: 0.5; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="400" fill="url(#bg)"/>

    <!-- ambient colour, kept behind everything and heavily blurred -->
    <g filter="url(#haze)">
      <ellipse cx="742" cy="18"  rx="250" ry="170" fill="url(#auroraA)"/>
      <ellipse cx="898" cy="212" rx="200" ry="170" fill="url(#auroraC)"/>
      <ellipse cx="72"  cy="392" rx="230" ry="150" fill="url(#auroraB)"/>
    </g>

    <!-- identity -->
    <text class="mono eyebrow" x="56" y="66">SOFTWARE DEVELOPER · DATA STREAMING</text>
    <text class="sans name"    x="56" y="120">Reagent Sandra</text>
    <rect x="56" y="138" width="66" height="4" rx="2" fill="url(#spectrum)"/>
    <text class="sans role"    x="56" y="176">Backend and streaming data — Go, Kafka, and the pipelines in between.</text>

    <!-- context chips -->
    <g>
      <rect x="56"  y="204" width="106" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06"
            stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text class="mono chip" x="109" y="222" text-anchor="middle">Jakarta, ID</text>

      <rect x="172" y="204" width="128" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06"
            stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text class="mono chip" x="236" y="222" text-anchor="middle">Bank Indonesia</text>

      <rect x="310" y="204" width="136" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06"
            stroke="#FFFFFF" stroke-opacity="0.13"/>
      <text class="mono chip" x="378" y="222" text-anchor="middle">BINUS · CS 3.59</text>
    </g>

    <line x1="56" y1="266" x2="844" y2="266" stroke="url(#rule)" stroke-width="1"/>
    <text class="mono quiet" x="56" y="294">PIPELINE</text>

    <!-- signature: the stream -->
    <g>
      <line x1="100" y1="336" x2="820" y2="336" stroke="url(#spectrum)"
            stroke-width="2" stroke-linecap="round" opacity="0.30"/>

      <g class="node">
        <circle cx="100" cy="336" r="14" fill="none" stroke="#FF4D8D" stroke-width="1.5"/>
      </g>
      <circle cx="100" cy="336" r="6" fill="#FF4D8D"/>
      <text class="mono stage" x="100" y="366" text-anchor="middle">CDC</text>

      <g class="node n2">
        <circle cx="340" cy="336" r="14" fill="none" stroke="#7C5CFF" stroke-width="1.5"/>
      </g>
      <circle cx="340" cy="336" r="6" fill="#7C5CFF"/>
      <text class="mono stage" x="340" y="366" text-anchor="middle">Kafka</text>

      <g class="node n3">
        <circle cx="580" cy="336" r="14" fill="none" stroke="#38E8C8" stroke-width="1.5"/>
      </g>
      <circle cx="580" cy="336" r="6" fill="#38E8C8"/>
      <text class="mono stage" x="580" y="366" text-anchor="middle">ksqlDB</text>

      <g class="node n4">
        <circle cx="820" cy="336" r="14" fill="none" stroke="#FFA23E" stroke-width="1.5"/>
      </g>
      <circle cx="820" cy="336" r="6" fill="#FFA23E"/>
      <text class="mono stage" x="820" y="366" text-anchor="middle">Analytics</text>

      <g filter="url(#spark)">
        <circle class="packet"    cx="100" cy="336" r="4" fill="#FFE9F2"/>
        <circle class="packet p2" cx="100" cy="336" r="4" fill="#E4DBFF"/>
        <circle class="packet p3" cx="100" cy="336" r="4" fill="#D6FFF5"/>
        <circle class="packet p4" cx="100" cy="336" r="4" fill="#FFEFD9"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="399" rx="24"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>
